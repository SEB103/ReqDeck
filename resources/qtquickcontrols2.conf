; Qt Quick Controls runtime style configuration.
; Active QML files import Material directly; this also aligns any generic Controls imports.
; Main.qml overrides Material.theme at runtime to support the View menu switch and
; binds Material.accent to BsTheme.accent; the accent below is the light-theme value.

[Controls]
Style=Material

[Material]
Theme=System
Variant=Dense
Accent=#C2185B
Primary=BlueGrey
