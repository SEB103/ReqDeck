# aqtinstall overrides for CI (read through the AQT_CONFIG environment variable;
# every key not listed here keeps aqtinstall's built-in default).
#
# Extract the Qt archives one at a time. With the default concurrency of 4,
# parallel extraction of the Qt 6.11.1 archives into the same prefix fails:
# 7-Zip reports "Cannot create output directory ... already exists" and py7zr
# reports "Bad7zFile: Specified path is bad".
[aqt]
concurrency: 1
